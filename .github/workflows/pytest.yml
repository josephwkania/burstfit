name: Python package

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: py${{ matrix.python-version }} (${{ matrix.deps }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.11", "3.12", "3.13", "3.14" ]
        deps: [ pinned ]
        experimental: [ false ]
        include:
          # Oldest supported versions (the lower bounds in pyproject.toml).
          - python-version: "3.11"
            deps: oldest
            experimental: false
          # Newest everything, to catch upcoming breakage early.
          - python-version: "3.14"
            deps: latest
            experimental: false
          # h5py (needed by your) has no 3.15 wheels yet, so it is built from source.
          - python-version: "3.15"
            deps: pinned
            experimental: true

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true
    - name: Set up uv
      uses: astral-sh/setup-uv@v6
    - name: Install HDF5 headers (to build h5py)
      if: matrix.python-version == '3.15'
      run: sudo apt-get update && sudo apt-get install -y libhdf5-dev pkg-config
    - name: Install package
      env:
        UV_SYSTEM_PYTHON: "1"
      run: |
        case "${{ matrix.deps }}" in
          pinned) uv pip install -c constraints/pipeline.txt -e ".[tests]" ;;
          oldest) uv pip install --resolution lowest-direct -e ".[tests]" ;;
          latest) uv pip install --upgrade -e ".[tests]" ;;
        esac
        uv pip install flake8
        python -c "import sys, numpy, scipy, burstfit; print(sys.version, 'numpy', numpy.__version__, 'scipy', scipy.__version__, 'burstfit', burstfit.__version__)"
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Run pytest
      env:
        MPLBACKEND: Agg
        OMP_NUM_THREADS: "1"
      run: python -m pytest --cov=burstfit --cov-report=xml
    - name: Upload coverage to Codecov
      if: matrix.python-version == '3.12' && matrix.deps == 'pinned'
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.xml
        fail_ci_if_error: false
